name: Prospector quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Agent-agnostic runtime bootstrap
        run: python prospector.py self-test

      - name: International discovery and social media rights gates
        run: python test_market_scope_and_site_research.py

      - name: Supervised Engine C, Client CMS and protected owner-preview gates
        run: |
          python test_engine_c_bridge.py
          python test_site_review_rounds.py
          python test_cms_compatibility_and_owner_preview.py
          python test_engine_c_cms_collections.py
          python test_menu_catalog_gate.py
          python test_hero_motion.py
          python test_flow_execution_ledger.py
          python test_hero_site_gate.py

      - name: Portable design-judge regressions
        run: python test_agent_runtime_portability.py

      - name: Production QA credential hygiene
        run: python prospector-de-sites/repo_secret_hygiene.py

      - name: Google Maps review evidence regressions
        run: python test_google_reviews_evidence.py

      - name: Autonomous site-review regressions
        run: python run_autonomous_site_review_regressions.py
