<!DOCTYPE html>
<html lang="pt-BR" data-pe-cms-admin>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | AutoCORA Client CMS</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F17;
      --card-bg: #111827;
      --card-border: rgba(255, 255, 255, 0.08);
      --ink: #F9FAFB;
      --ink-muted: #9CA3AF;
      --accent: #16A34A;
      --accent-hover: #15803D;
      --accent-light: rgba(22, 163, 74, 0.15);
      --danger: #EF4444;
      --danger-hover: #DC2626;
      --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Login State */
    #cms-login-view {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 24px;
    }
    .cms-login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: var(--shadow-lg);
    }
    .cms-brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--accent-light);
      color: #4ADE80;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .cms-login-card h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FFF;
    }
    .cms-login-card p {
      font-size: 13px;
      color: var(--ink-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .cms-form-group {
      margin-bottom: 18px;
    }
    .cms-form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }
    .cms-form-group input {
      width: 100%;
      background: #1F2937;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 11px 14px;
      color: #FFF;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    .cms-form-group input:focus {
      border-color: #4ADE80;
    }
    .cms-btn {
      width: 100%;
      background: var(--accent);
      color: #FFF;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }
    .cms-btn:hover { background: var(--accent-hover); }
    .cms-btn:active { transform: scale(0.99); }
    .cms-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .cms-error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }
    /* Workspace State */
    #cms-workspace-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #cms-header-bar {
      height: 54px;
      background: #111827;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
    }
    .cms-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cms-site-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFF;
    }
    .cms-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cms-action-btn {
      background: #1F2937;
      color: #E5E7EB;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .cms-action-btn:hover { background: #374151; color: #FFF; }
    .cms-action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFF;
    }
    .cms-action-btn.primary:hover { background: var(--accent-hover); }
    .cms-action-btn.danger {
      color: #F87171;
    }
    .cms-action-btn.danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }
    #cms-editor-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #FFF;
    }
    #cms-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1F2937;
      color: #FFF;
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: var(--shadow-lg);
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: none;
      z-index: 1000;
      animation: fadeIn 0.2s ease;
    }
    #cms-toast.success { border-color: #4ADE80; color: #86EFAC; }
    #cms-toast.error { border-color: #EF4444; color: #FCA5A5; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) {
      .cms-header-actions .cms-action-btn:not(.primary):not(#btn-logout) { display: none; }
      #cms-header-bar { padding: 0 12px; }
      .cms-login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <!-- View 1: Login -->
  <div id="cms-login-view">
    <div class="cms-login-card">
      <div class="cms-brand-badge">AutoCORA Client CMS</div>
      <h1 id="login-heading">Painel de Conteúdo</h1>
      <p>Gerencie textos, imagens, WhatsApp e contatos com facilidade e segurança.</p>
      
      <div id="login-error" class="cms-error-msg"></div>

      <form id="cms-login-form">
        <div class="cms-form-group">
          <label for="cms-username">Usuário</label>
          <input type="text" id="cms-username" autocomplete="username" required placeholder="Seu usuário">
        </div>
        <div class="cms-form-group">
          <label for="cms-password">Senha</label>
          <input type="password" id="cms-password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" id="cms-login-submit" class="cms-btn">Acessar Painel</button>
      </form>
    </div>
  </div>

  <!-- View 2: Workspace / Editor -->
  <div id="cms-workspace-view">
    <header id="cms-header-bar">
      <div class="cms-header-left">
        <span class="cms-brand-badge" style="margin:0;">CMS</span>
        <span id="cms-site-label" class="cms-site-title">Carregando...</span>
      </div>
      <div class="cms-header-actions">
        <button type="button" id="btn-save-draft" class="cms-action-btn">Salvar Rascunho</button>
        <button type="button" id="btn-rollback" class="cms-action-btn danger">Restaurar Anterior</button>
        <button type="button" id="btn-publish" class="cms-action-btn primary">Publicar no Ar</button>
        <button type="button" id="btn-logout" class="cms-action-btn">Sair</button>
      </div>
    </header>
    <iframe id="cms-editor-frame" title="Editor Visual"></iframe>
  </div>

  <div id="cms-toast"></div>

  <script>
  (function() {
    'use strict';
    var slug = getSlugFromUrl();
    var tokenKey = 'autocora_cms_token:' + slug;
    var loginView = document.getElementById('cms-login-view');
    var workspaceView = document.getElementById('cms-workspace-view');
    var loginForm = document.getElementById('cms-login-form');
    var loginError = document.getElementById('login-error');
    var submitBtn = document.getElementById('cms-login-submit');
    var siteLabel = document.getElementById('cms-site-label');
    var editorFrame = document.getElementById('cms-editor-frame');
    var toastEl = document.getElementById('cms-toast');

    function getSlugFromUrl() {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var idx = parts.indexOf('clientes');
      if (idx >= 0 && parts[idx + 1]) {
        return parts[idx + 1];
      }
      return parts[0] || 'instituto-ferreira-odontologia-rio-claro';
    }

    function showToast(msg, type, duration) {
      toastEl.textContent = msg;
      toastEl.className = type || 'success';
      toastEl.style.display = 'block';
      setTimeout(function() { toastEl.style.display = 'none'; }, duration || 4000);
    }

    function checkSession() {
      var token = sessionStorage.getItem(tokenKey);
      if (!token) {
        showLogin();
        return;
      }
      fetch('/api/client-cms/status?slug=' + encodeURIComponent(slug), {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success && data.authorized) {
          showWorkspace(data);
        } else {
          sessionStorage.removeItem(tokenKey);
          showLogin(data.error || 'Sessão expirada. Faça login novamente.');
        }
      })
      .catch(function() {
        showLogin();
      });
    }

    function showLogin(err) {
      workspaceView.style.display = 'none';
      loginView.style.display = 'flex';
      editorFrame.src = 'about:blank';
      if (err) {
        loginError.textContent = err;
        loginError.style.display = 'block';
      } else {
        loginError.style.display = 'none';
      }
    }

    function showWorkspace(tenantInfo) {
      loginView.style.display = 'none';
      workspaceView.style.display = 'flex';
      siteLabel.textContent = tenantInfo.displayName || slug;
      var token = sessionStorage.getItem(tokenKey);
      editorFrame.src = '/api/client-cms/editor-frame?slug=' + encodeURIComponent(slug) + '&token=' + encodeURIComponent(token);
    }

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      loginError.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Autenticando...';

      var user = document.getElementById('cms-username').value.trim();
      var pass = document.getElementById('cms-password').value;

      fetch('/api/client-cms/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: slug, username: user, password: pass })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Acessar Painel';
        if (data.success && data.token) {
          sessionStorage.setItem(tokenKey, data.token);
          checkSession();
        } else {
          loginError.textContent = data.error || 'Credenciais inválidas.';
          loginError.style.display = 'block';
        }
      })
      .catch(function(err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Acessar Painel';
        loginError.textContent = 'Falha na conexão com o servidor de autenticação.';
        loginError.style.display = 'block';
      });
    });

    document.getElementById('btn-logout').addEventListener('click', function() {
      sessionStorage.removeItem(tokenKey);
      showLogin('Você saiu do painel com sucesso.');
    });

    document.getElementById('btn-save-draft').addEventListener('click', function() {
      var token = sessionStorage.getItem(tokenKey);
      try {
        var win = editorFrame.contentWindow;
        var html = typeof win.cleanPublicDocument === 'function' ? win.cleanPublicDocument() : win.document.documentElement.outerHTML;
        fetch('/api/client-cms/draft', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ slug: slug, html: html })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success) showToast('Rascunho salvo com sucesso!', 'success');
          else showToast(d.error || 'Erro ao salvar rascunho', 'error');
        });
      } catch (e) {
        showToast('Não foi possível capturar o rascunho.', 'error');
      }
    });

    document.getElementById('btn-publish').addEventListener('click', function() {
      if (!confirm('Deseja publicar as alterações diretamente no site no ar?')) return;
      var token = sessionStorage.getItem(tokenKey);
      try {
        var win = editorFrame.contentWindow;
        var html = typeof win.cleanPublicDocument === 'function' ? win.cleanPublicDocument() : win.document.documentElement.outerHTML;
        showToast('Publicando alterações...', 'success', 10000);
        fetch('/api/client-cms/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ slug: slug, html: html, confirmed: true })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.success) {
            showToast('Site publicado no ar com sucesso! (Commit: ' + (d.commit || '').substring(0,7) + ')', 'success', 6000);
          } else {
            showToast(d.error || 'Falha ao publicar.', 'error', 6000);
          }
        });
      } catch (e) {
        showToast('Erro ao processar publicação.', 'error');
      }
    });

    document.getElementById('btn-rollback').addEventListener('click', function() {
      if (!confirm('Tem certeza de que deseja restaurar a versão anterior publicada?')) return;
      var token = sessionStorage.getItem(tokenKey);
      showToast('Restaurando versão anterior...', 'success', 10000);
      fetch('/api/client-cms/rollback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ slug: slug, confirmed: true })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          showToast('Versão anterior restaurada com sucesso!', 'success', 6000);
          setTimeout(function() { editorFrame.src = editorFrame.src; }, 1500);
        } else {
          showToast(d.error || 'Falha ao restaurar versão anterior.', 'error', 6000);
        }
      });
    });

    checkSession();
  })();
  </script>
</body>
</html>
